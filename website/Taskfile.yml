version: '3'

vars:
  TMUX_SESSION: task-website
  DEFAULT_PORT: '3002'
  DEFAULT_HOST: '0.0.0.0'

tasks:
  install:
    desc: Setup VitePress locally
    # start:all reaches this task through two parallel branches, and pnpm does
    # not expect two installs at once.
    run: once
    cmds:
      - pnpm install
    sources:
      - package.json
      - pnpm-lock.yaml

  default:
    desc: Start website in foreground
    deps: [install]
    aliases: [s, start, start:next]
    vars:
      HOST: '{{default .DEFAULT_HOST .HOST}}'
      PORT: '{{default .DEFAULT_PORT .PORT}}'
    env:
      DOCS_CHANNEL: '{{.CHANNEL | default "next"}}'
      DOCS_SITE: '{{.SITE | default "preview"}}'
      # Only the dev server sets this: it is what keeps the localhost URLs of
      # the version selector out of a build. See .vitepress/config.ts.
      DOCS_LOCAL: '1'
    cmds:
      - pnpm dev --host={{.HOST}} --port={{.PORT}}

  dev:
    desc: Start website in tmux background session (watch mode)
    deps: [install]
    aliases: [watch, bg]
    vars:
      HOST: '{{default .DEFAULT_HOST .HOST}}'
      PORT: '{{default .DEFAULT_PORT .PORT}}'
    cmds:
      - |
        if tmux has-session -t {{.TMUX_SESSION}} 2>/dev/null; then
          echo "⚠️  Session '{{.TMUX_SESSION}}' already exists. Use 'task website:stop' first or 'task website:restart'."
          exit 1
        fi
        tmux new-session -d -s {{.TMUX_SESSION}} "cd {{.ROOT_DIR}}/website && pnpm dev --host={{.HOST}} --port={{.PORT}}"
        echo "✅ Website started in tmux session '{{.TMUX_SESSION}}'"
        echo "📝 View logs: task website:logs"
        echo "🛑 Stop server: task website:stop"
        echo "🌐 URL: http://{{.HOST}}:{{.PORT}}"

  stop:
    desc: Stop website tmux session
    cmds:
      - |
        if tmux has-session -t {{.TMUX_SESSION}} 2>/dev/null; then
          tmux kill-session -t {{.TMUX_SESSION}}
          echo "✅ Website session stopped"
        else
          echo "ℹ️  No session '{{.TMUX_SESSION}}' found"
        fi

  restart:
    desc: Restart website tmux session
    aliases: [r]
    cmds:
      - task: stop
      - task: dev

  logs:
    desc: View website tmux session logs
    aliases: [l]
    cmds:
      - |
        if tmux has-session -t {{.TMUX_SESSION}} 2>/dev/null; then
          tmux attach-session -t {{.TMUX_SESSION}}
        else
          echo "❌ No session '{{.TMUX_SESSION}}' found. Start with 'task website:dev'"
          exit 1
        fi

  status:
    desc: Check website session status
    cmds:
      - |
        if tmux has-session -t {{.TMUX_SESSION}} 2>/dev/null; then
          echo "✅ Website is running in tmux session '{{.TMUX_SESSION}}'"
          echo "📝 View logs: task website:logs"
          lsof -i :{{.DEFAULT_PORT}} 2>/dev/null | grep LISTEN || echo "⚠️  Port {{.DEFAULT_PORT}} not listening yet"
        else
          echo "❌ Website is not running"
        fi

  # The port is half of a pair: config.ts links the two channels to each other
  # on 3001 and 3002, so both dev servers can run side by side.
  start:latest:
    desc: Start website with the content of the released version
    cmds:
      - task: default
        vars: { CHANNEL: latest, PORT: '{{default "3002" .PORT}}' }

  start:all:
    desc: Start both channels side by side
    deps: [default, start:latest]

  lint:
    desc: Lint website
    deps: [install]
    cmds:
      - pnpm lint

  build:
    desc: Build website
    aliases: [build:next]
    deps: [install]
    env:
      DOCS_CHANNEL: '{{.CHANNEL | default "next"}}'
      DOCS_SITE: '{{.SITE | default "preview"}}'
    cmds:
      - pnpm build

  build:latest:
    desc: Build website with the content of the released version
    cmds:
      - task: build
        vars: { CHANNEL: latest, SITE: production }

  preview:
    desc: Preview Website
    deps: [build]
    aliases: [serve]
    vars:
      HOST: '{{default "localhost" .HOST}}'
      PORT: '{{default .DEFAULT_PORT .PORT}}'
    cmds:
      - pnpm preview --host={{.HOST}} --port={{.PORT}}

  clean:
    desc: Clean temp directories
    cmds:
      - rm -rf ./.vitepress/dist

  # --no-build is what makes the channel stick: the CLI builds by default, and
  # that build would come from netlify.toml, which knows nothing about the
  # channel these tasks just built.
  deploy:next:
    desc: Build and deploy next.taskfile.dev
    cmds:
      - task: build
        vars: { CHANNEL: next, SITE: production }
      - pnpm netlify deploy --prod --no-build --site=4e13dfcf-fc0d-4bec-ad60-b918a8dc3942

  deploy:prod:
    desc: Build and deploy taskfile.dev
    deps: [build:latest]
    cmds:
      - pnpm netlify deploy --prod --no-build --site=e625bc6a-1cd3-465d-ad30-7bbddaeb4f31
